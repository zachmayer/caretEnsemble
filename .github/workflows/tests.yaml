on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: Tests

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: r-lib/actions/setup-r@v2.14.0
      with:
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2.14.0
    - run: make test

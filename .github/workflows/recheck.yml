on:
    workflow_dispatch:
      inputs:
        which:
          type: choice
          description: Which dependents to check
          options:
          - strong
          - most

name: Reverse dependency check

permissions:
  contents: read
  
jobs:
    revdep_check:
      name: Reverse check ${{ inputs.which }} dependents
      uses: r-devel/recheck/.github/workflows/recheck.yml@1a934fef37ec1a6073b25a22fdb09a5e81f02238 # v1
      with:
        which: ${{ inputs.which }}
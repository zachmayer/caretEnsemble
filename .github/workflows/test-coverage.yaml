# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2.14.0

      - name: Run unit tests and report coverage
        run: make clean && make cobertura.xml

      - name: Upload test results to codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          fail_ci_if_error: true
          files: ${{ runner.temp }}/cobertura.xml
          flags: unittests
          verbose: true

      - name: Test that coverage level is good
        run: make coverage-test
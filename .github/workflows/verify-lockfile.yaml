name: Verify lockfile
# Fails when .github/workflows/actions.lock is out of step with the workflows:
# a `uses:` it doesn't cover, or a locked commit its tag no longer reaches.
# GitHub refuses to start a workflow that uses an action the lockfile doesn't
# cover, and that workflow's checks vanish from the pull request instead of
# failing, so this is the check that goes red. zizmor doesn't: once a lockfile
# exists it accepts every tag. Its own workflow, so it starts when another
# can't. To fix a failure, run `gh actions-lock` and commit the result.

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

# None by default; the job grants itself what it reads.
permissions: {}

jobs:
  verify-lockfile:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false # both steps below call the API with GH_TOKEN alone
      # Unpinned, always latest: no Dependabot ecosystem tracks a gh extension,
      # so a pin here would only age, while the lockfile format (v0.0.x) and the
      # runner that enforces it keep moving. It is GitHub's own tool, alone in a
      # job whose token only reads this repo.
      - run: gh extension install github/gh-actions-lock
      - run: gh actions-lock --verify
